<!DOCTYPE html>
<html lang="th">
<head>
<script>
// แสดงข้อผิดพลาดบนหน้าจอ เพื่อให้รู้สาเหตุเวลาแอปไม่ทำงาน
window.addEventListener('error', function (e) {
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:999;background:#B25843;color:#fff;padding:12px 14px;border-radius:12px;font:14px/1.5 sans-serif;white-space:pre-wrap';
  box.textContent = 'Error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '') + '\n\nลองปิดแอปแล้วเปิดใหม่ / Close and reopen the app';
  (document.body || document.documentElement).appendChild(box);
});
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Split&amp;Go</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split&amp;Go">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F5EDD6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A13" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Marcellus&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- สี: Aspen Green #7E9B75 และ Papyrus #F5EDD6 ---------- */
:root{
  --bg:#F5EDD6; --surface:#FBF7EA; --sunk:#EFE6CB; --line:#E3D8B9;
  --ink:#23291F; --ink2:#5B6453; --ink3:#8C9280;
  --brand:#7E9B75; --brand-ink:#44603E; --brand-soft:#E4E6CC; --on-brand:#FBF7EA;
  --out:#A9533F; --in:#4A7541; --warn:#9A6A1C;
  --c1:#44603E; --c2:#7E9B75; --c3:#AEBF9F; --c4:#C9B27E; --c5:#DDCFA6; --c6:#E9E0C4;
  --serif:"Noto Serif Thai","Noto Serif",Georgia,serif;
  --sans:"Anuphan","Sukhumvit Set","Thonburi",-apple-system,system-ui,sans-serif;
  --shadow:0 1px 0 rgba(68,96,62,.05),0 8px 24px -12px rgba(68,96,62,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141A13; --surface:#1C2419; --sunk:#232C20; --line:#2F3A2B;
    --ink:#F2EAD3; --ink2:#C3BDA7; --ink3:#8A907E;
    --brand:#9CB792; --brand-ink:#B9CEAF; --brand-soft:#2A3626; --on-brand:#141A13;
    --out:#E28F79; --in:#A2C996; --warn:#E3B062;
    --c1:#B9CEAF; --c2:#8FAE85; --c3:#667F5E; --c4:#C9B27E; --c5:#8E7F58; --c6:#4A5543;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 26px -14px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0 auto;max-width:520px;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 110px);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
.out{color:var(--out)} .in{color:var(--in)}
.empty{color:var(--ink3);text-align:center;padding:26px 8px;font-size:15px}
h1,h2,.serif{font-family:var(--serif);letter-spacing:-.005em}
h1{font-size:30px;font-weight:600;line-height:1.2;margin:0}
h2{font-size:18px;font-weight:600;line-height:1.3;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ปุ่ม */
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.btn{width:100%;height:54px;border:0;border-radius:16px;background:var(--brand-ink);color:var(--on-brand);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.block .ghost,.sheet .ghost{background:var(--sunk);border-color:transparent}
.ghost.primary{background:var(--brand-ink);color:var(--on-brand);border-color:transparent}
.link{border:0;background:none;padding:0;font-size:14px;font-weight:600;color:var(--brand-ink);display:inline-flex;align-items:center;gap:4px}
.danger{width:100%;border:0;background:none;color:var(--out);font-weight:600;padding:14px;margin-top:4px}

/* หัวหน้า */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.hello{color:var(--ink2);font-size:15px;margin:4px 0 20px}
.actions{display:flex;gap:8px;margin-bottom:20px}
.actions .ghost{flex:1;justify-content:center;padding:11px 14px;font-size:15px}

/* การ์ดและหัวข้อ */
.block{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.bh{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.badge{width:34px;height:34px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.bt{flex:1;min-width:0}
.bt p{margin:2px 0 0;font-size:13px;color:var(--ink3);line-height:1.45}
.bh .link{margin-top:6px}
.block > .bh:last-child{margin-bottom:0;align-items:center}

/* ตัวเลขใหญ่ */
.hero{margin:4px 2px 22px}
.lbl{font-size:14px;color:var(--ink2)}
.big{font-family:var(--serif);font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:2px 0 6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:9px 12px;font-size:15px;align-items:baseline}
.kv span{color:var(--ink2)} .kv b{font-weight:500;text-align:right}
.kv .big2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em}
.kv small{font-size:12px;color:var(--ink3);font-weight:400}

/* สัดส่วนหมวด */
.stack{display:flex;gap:3px;height:10px;margin:4px 0 16px}
.stack i{display:block;border-radius:4px;min-width:4px}
.leg{display:grid;grid-template-columns:28px 1fr auto 42px;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.leg .ci{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff}
.leg b{font-weight:500} .leg em{font-style:normal;color:var(--ink3);font-size:13px;text-align:right}
button.leg{width:100%;border:0;background:none;text-align:left}
.ctot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.ctot b{font-family:var(--serif);font-size:26px;font-weight:600}
.ctot span{font-size:14px;color:var(--ink2)}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pick .chip{padding:5px 12px;font-size:14px}

/* รายการ */
.dh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);margin:18px 0 2px}
.dh:first-child{margin-top:0}
.dh .dd{width:8px;height:8px;border-radius:50%;background:var(--dc,var(--ink3))}
.dh .sp{flex:1}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .c{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-weight:600;white-space:nowrap;text-align:right}
.row .v small{display:block;font-size:12px;font-weight:400;color:var(--ink3)}
.ic{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.tap{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.pill.soon{color:var(--brand-ink)} .pill.now,.pill.ok{color:var(--in)} .pill.no{color:var(--out)}
.pill.est{color:var(--warn);margin-left:6px;padding:1px 8px;font-size:11px;vertical-align:1px}

/* รายการทริป */
.trip{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:24px 20px 18px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.ribbon{position:absolute;left:0;right:0;top:0;height:5px;display:flex}
.ribbon i{flex:1;background:var(--dc)}
.trip .n{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.3}
.trip .m{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);margin-top:4px}
.trip .m svg{color:var(--ink3)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* หน้าทริป */
.thead{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
.thead .mid{flex:1;min-width:0;padding-top:2px}
.thead h1{font-size:26px}
.thead .m{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);margin-top:3px}
.thead .m svg{color:var(--ink3)}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:16px;padding:4px;margin:0 0 20px}
.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:12px;font-size:13px;font-weight:500;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.tabs button.on{background:var(--surface);color:var(--brand-ink);box-shadow:0 1px 3px rgba(35,41,31,.12)}

.ticket{padding:14px 0;border-bottom:1px solid var(--line)}
.ticket:last-child{border-bottom:0;padding-bottom:0}
.ticket:first-of-type{padding-top:0}
.tk-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2)}
.tk-route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin:8px 0 6px}
.tk-route b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1}
.tk-route small{font-size:13px;color:var(--ink2)}
.tk-route .r{text-align:right}
.tk-line{position:relative;border-top:1.5px dashed var(--line);display:grid;place-items:center}
.tk-line svg{position:absolute;top:-10px;background:var(--surface);padding:0 4px;color:var(--brand);box-sizing:content-box}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.th{width:88px;height:66px;object-fit:cover;border-radius:12px;display:block}
.nt{font-size:14px;color:var(--ink2);margin-top:4px;white-space:pre-wrap}
.tt{font-weight:600;font-size:16px;line-height:1.35}

/* วัน: สีประจำวันแบบไทย */
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:2px 20px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 14px 9px;text-align:left;min-width:82px;position:relative}
.days button::before{content:"";display:block;width:18px;height:4px;border-radius:2px;background:var(--dc);margin-bottom:7px}
.days b{display:block;font-size:14px;font-weight:600}
.days span{font-size:12px;color:var(--ink2)}
.days button.on{background:color-mix(in srgb,var(--dc) 22%,var(--surface));border-color:color-mix(in srgb,var(--dc) 70%,var(--line))}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
.dayhead h2{font-size:22px}
.dayhead span{font-size:14px;color:var(--ink2)}
.dayhead i{width:10px;height:10px;border-radius:50%;background:var(--dc);align-self:center}
.banner{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);padding:0 4px 12px}
.banner svg{color:var(--brand)}
.tl{margin-bottom:14px}
.tli{display:grid;grid-template-columns:44px 12px 1fr;gap:10px;position:relative;padding-bottom:18px}
.tli::before{content:"";position:absolute;left:59px;top:14px;bottom:-2px;width:1px;background:var(--line)}
.tli:last-child::before{display:none}
.tm{font-size:13px;font-weight:600;color:var(--ink2);text-align:right;padding-top:2px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--dc,var(--brand));margin:6px 0 0 0;position:relative;z-index:1;box-shadow:0 0 0 3px var(--surface)}
.tli.leg .dot{background:var(--surface);border:1.5px solid var(--ink3)}
.tli.leg .tt{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;color:var(--ink2)}
.sub{font-size:13px;color:var(--ink3)}
.cost{font-size:13px;color:var(--ink2);margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .ghost{justify-content:center;padding:12px;border-radius:14px}
.who{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.who:last-child{border-bottom:0}
.who .s{font-size:13px;color:var(--ink2)}
.who .v{text-align:right;font-weight:600;align-self:center}
.mine{background:linear-gradient(160deg,var(--brand-soft),var(--surface) 70%)}
.privacy{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink2);margin:0 4px 14px}
.privacy svg{margin-top:2px;color:var(--brand)}

/* ปุ่มลอย + แจ้งเตือน */
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:41;height:54px;border-radius:27px;padding:0 20px 0 16px;
  border:0;background:var(--brand-ink);color:var(--on-brand);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;box-shadow:0 12px 28px -10px rgba(35,41,31,.55)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,12px);z-index:90;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ฟอร์ม */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:500;color:var(--ink2);font-size:15px}
.seg button.on{background:var(--surface);color:var(--brand-ink);box-shadow:0 1px 2px rgba(35,41,31,.12)}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-size:15px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chip.on{background:var(--brand-ink);color:var(--on-brand);border-color:var(--brand-ink)}
.chip[data-custom]{border-style:dashed} .chip.on[data-custom]{border-style:solid}
.checks,.jchecks,.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick .chip{padding:8px 13px 8px 10px}
.othr{width:100%;border:0;background:var(--sunk);border-radius:12px;padding:0 12px;font-size:16px;height:48px;margin-top:10px}
.tiny{font-size:12px;color:var(--ink3);margin-top:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,26,19,.42);display:none;z-index:60;align-items:flex-end}
.sheet-bg.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:28px 28px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.shh{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding:14px 16px 10px;text-align:center}
.shh::before{content:"";position:absolute;left:50%;margin-left:-18px;margin-top:-26px;width:36px;height:4px;border-radius:2px;background:var(--line)}
.shh b{font-family:var(--serif);font-weight:600;font-size:17px}
.shh button{border:0;background:none;font-size:16px;color:var(--ink2);padding:4px;text-align:left}
.shh .strong{color:var(--brand-ink);font-weight:600;text-align:right}
.shb{overflow-y:auto;padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.shb .block{box-shadow:none;background:var(--bg)}
.shb .block .ghost{background:var(--surface)}
.fld{margin-bottom:14px}
.fl{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:0;background:var(--sunk);border-radius:12px;padding:12px;font-size:16px;min-height:48px}
.fld textarea{min-height:76px;resize:vertical}
.fld .amtin{font-family:var(--serif);font-size:28px;font-weight:600;min-height:60px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.mrow button{border:0;background:var(--brand-ink);color:var(--on-brand);border-radius:12px;padding:0 16px;font-size:14px;font-weight:600}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph.busy{opacity:.45;pointer-events:none}
.phbtn{border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:15px;display:inline-flex;align-items:center;gap:8px;color:var(--ink2)}
.phimg img{width:88px;height:66px;object-fit:cover;border-radius:12px;display:block}
.prow{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin-top:8px}
.prow input{border:0;background:var(--sunk);border-radius:10px;padding:10px;font-size:16px;text-align:right;width:100%}
.hint{font-size:14px;color:var(--ink2);margin-top:10px}
#fxHint{white-space:pre-line}
.viewer{position:fixed;inset:0;background:#000;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column}
.viewer.show{display:flex}
.viewer img{max-width:100%;max-height:90vh;object-fit:contain}
.viewer .vh{color:#999;font-size:14px;margin-top:10px}
.uname{font-family:var(--serif);font-size:26px;font-weight:600;margin:2px 0 4px}
.code{font-family:var(--serif);font-size:42px;font-weight:600;letter-spacing:.14em;margin:2px 0 6px;color:var(--brand-ink)}
.codein{text-transform:uppercase;letter-spacing:.2em;font-size:24px!important;text-align:center;font-weight:600}
.jtrip{background:var(--sunk);border-radius:14px;padding:12px 14px;margin:4px 0 16px}
.jtrip .tt{font-family:var(--serif);font-size:18px}

/* แถบสถานะ iPhone ตอนเปิดจากหน้าจอโฮม */
.sbar{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);z-index:95;pointer-events:none;background:var(--brand-ink)}
@media (prefers-color-scheme:dark){.sbar{background:var(--bg)}}

/* หน้าเข้าสู่ระบบ */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 24px)}
.gbox{max-width:420px;margin:0 auto}
.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.gbox .logo{width:64px;height:64px;border-radius:18px;display:block}
.gbox h1{font-size:34px;margin-bottom:6px}
.brand{font-family:"Marcellus",var(--serif);font-weight:400;font-size:40px!important;letter-spacing:.01em;color:var(--brand-ink)}
.brand .amp{font-size:.6em;margin:0 .06em}
.gbox p{color:var(--ink2);margin:0 0 24px}
.gbox .fld input{background:var(--surface);border:1px solid var(--line)}
.gbox .seg{background:var(--sunk);margin-bottom:18px}
.gmsg{color:var(--out);font-size:14px;min-height:21px;margin:-4px 0 12px}
.gbox .link{display:block;margin:16px auto 0}
.lang{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:999px;padding:3px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.lang button.on{background:var(--surface);color:var(--brand-ink);box-shadow:0 1px 2px rgba(35,41,31,.12)}
@media (prefers-color-scheme:dark){.tabs button.on,.seg button.on,.lang button.on{background:var(--brand-soft);box-shadow:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.sheet{animation:none}}
</style>

<body>

<section id="trips"></section>
<button class="fab" id="fab" hidden></button>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="viewer" id="viewer"></div>
<div class="toast" id="toast"></div>
<div class="sbar"></div>

<div class="gate" id="gate" hidden>
  <div class="gbox">
    <div class="gtop"><img class="logo" alt="" src="apple-touch-icon.png"><div class="lang" id="gLang"></div></div>
    <h1 class="brand">Split<span class="amp">&amp;</span>Go</h1>
    <p id="gSub"></p>
    <div class="seg" id="gMode"><button type="button" data-m="login" class="on" data-t="เข้าสู่ระบบ"></button><button type="button" data-m="signup" data-t="สมัครใหม่"></button></div>

      <input id="gUrl" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="fld"><label class="fl" for="gUser" data-t="ชื่อผู้ใช้"></label>
      <input id="gUser" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
    <div class="fld"><label class="fl" for="gPass" data-t="รหัสผ่าน"></label>
      <input id="gPass" type="password" autocomplete="current-password"></div>
    <div class="fld" id="gPass2Wrap" hidden><label class="fl" for="gPass2" data-t="ใส่รหัสผ่านอีกครั้ง"></label>
      <input id="gPass2" type="password" autocomplete="new-password"></div>

    <div class="gmsg" id="gMsg"></div>
    <button class="btn" id="gGo"></button>
    <button class="link" id="gServer" type="button" data-t="เปลี่ยนลิงก์ Apps Script"></button>
  </div>
</div>

const EN_RX = [
  [/^ชื่อ "(.+)" มีเพื่อนเลือกไปแล้ว$/, '"$1" is already taken by a friend'],
  [/^ลบชื่อ "(.+)" ไม่ได้ เพราะผูกกับบัญชี (.+) อยู่$/, 'Can\'t remove "$1": it belongs to account $2'],
  [/^ไม่มีเรทของ (.+)$/, 'No rate for $1'], [/^ไม่รู้จักคำสั่ง (.+)$/, 'Unknown command $1']
];
const LS = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};
let LANG = LS.get('ts_lang') || 'th';
const t = s => LANG === 'en' ? (EN[s] ?? s) : s;
const tf = (s, v) => t(s).replace(/\{(\w+)\}/g, (m, k) => v[k] ?? m);
const terr = m => { if (LANG !== 'en') return m; if (EN[m]) return EN[m]; for (const [rx, r] of EN_RX) if (rx.test(m)) return m.replace(rx, r); return m; };
const LOC = () => LANG === 'en' ? 'en-GB' : 'th-TH';
function setLang(l) {
  LANG = l; LS.set('ts_lang', l); document.documentElement.lang = l;
  $$('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  $('#gLang').innerHTML = langSwitch();
  if (!$('#gate').hidden) { setGateMode(GMODE); gateSub(); }
  renderFab();
  if (T.id && trip()) renderTrips(); else if (T.list) renderTrips();
}
const langSwitch = () => [['th', 'ไทย'], ['en', 'EN']].map(([k, l]) => `<button type="button" data-lang="${k}" class="${LANG === k ? 'on' : ''}">${l}</button>`).join('');
document.addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) { e.preventDefault(); setLang(b.dataset.lang); if (b.closest('#sheet')) openAccount(); } });

// ใส่ลิงก์ Apps Script ของคุณระหว่าง ' ' ตรงนี้ ทุกคนที่เปิดแอปจะไม่ต้องกรอกลิงก์เอง
const DEFAULT_API = '';
const QP = new URLSearchParams(location.search);
const QAPI = QP.get('api') || '';
let QJOIN = (QP.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const API = { url: QAPI || LS.get('ts_url') || DEFAULT_API, tok: LS.get('ts_tok') };
['ts_key', 'ts_pass'].forEach(k => LS.set(k, '')); // เวอร์ชันเก่าเคยเก็บรหัสไว้ในเครื่อง ลบทิ้ง
const ME = { username: LS.get('ts_user') };
async function call(url, body) {
  let res;
  try {
    res = await fetch(url, { method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch (e) { throw new Error(t('เชื่อมต่อไม่ได้ เช็คอินเทอร์เน็ต หรือตั้งค่า Apps Script ให้ "ทุกคน" เข้าถึงได้')); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error(t('Apps Script ตอบกลับผิดรูปแบบ เช็คว่าลิงก์ถูกและ Deploy เวอร์ชันล่าสุดแล้ว')); }
  if (!j.ok) { const err = new Error(terr(j.error || 'เกิดข้อผิดพลาด')); err.code = j.code; throw err; }
  return j.data;
}
async function run(fn, ...args) {
  try { return await call(API.url, { t: API.tok, fn, args }); }
  catch (e) { if (e.code === 'AUTH') { setSession('', ME.username); showGate(t('กรุณาเข้าสู่ระบบอีกครั้ง')); } throw e; }
}
function setSession(tok, user) { API.tok = tok; ME.username = user; LS.set('ts_tok', tok); LS.set('ts_user', user); }
const inviteLink = code => { // ถ้าฝังลิงก์ไว้ในแอปแล้ว ลิงก์เชิญจะสั้นลง
  const q = [API.url && API.url !== DEFAULT_API ? 'api=' + enc(API.url) : '', code ? 'join=' + code : ''].filter(Boolean).join('&');
  return location.origin + location.pathname + (q ? '?' + q : '');
};
let GMODE = 'login';
function setGateMode(m) {
  GMODE = m;
  $$('#gMode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#gPass2Wrap').hidden = $('#gHint').hidden = m !== 'signup';
  $('#gGo').textContent = t(m === 'signup' ? 'สมัครและเข้าใช้งาน' : 'เข้าสู่ระบบ');
  $('#gPass').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
}
const gateSub = () => { $('#gSub').textContent = t(QJOIN ? 'เพื่อนชวนคุณเข้าทริป สมัครบัญชีหรือเข้าสู่ระบบก่อน แล้วแอปจะพาเข้าทริปให้' : 'วางแผนทริปกับเพื่อน และดูว่าใครใช้เงินไปเท่าไร'); };
function showGate(msg, mode) {
  closeForm(); $('#fab').hidden = true;
  $('#gUrlWrap').hidden = !!API.url; $('#gServer').hidden = !API.url;
  $('#gUrl').value = API.url;
  $('#gUser').value = ME.username || ''; $('#gPass').value = ''; $('#gPass2').value = '';
  setGateMode(mode || (QJOIN && !ME.username ? 'signup' : 'login'));
  gateSub();
  $('#gMsg').textContent = msg || '';
  $('#gate').hidden = false;
}
$('#gMode').onclick = e => { const b = e.target.closest('button'); if (b) { setGateMode(b.dataset.m); $('#gMsg').textContent = ''; } };
$('#gServer').onclick = () => { $('#gUrlWrap').hidden = false; $('#gServer').hidden = true; $('#gUrl').focus(); };
$('#gGo').onclick = async () => {
  const url = $('#gUrl').value.trim(), user = $('#gUser').value.trim(), pass = $('#gPass').value;
  const msg = x => { $('#gMsg').textContent = x; };
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) return msg(t('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com และลงท้ายด้วย /exec'));
  if (!user || !pass) return msg(t('ใส่ชื่อผู้ใช้และรหัสผ่าน'));
  if (GMODE === 'signup' && pass !== $('#gPass2').value) return msg(t('รหัสผ่านสองช่องไม่ตรงกัน'));
  const b = $('#gGo'), label = b.textContent; b.disabled = true; b.textContent = t('รอสักครู่…'); msg('');
  try {
    const r = await call(url, { fn: GMODE === 'signup' ? 'register' : 'login', args: [user, pass] });
    API.url = url; LS.set('ts_url', url);
    resetState(); setSession(r.token, r.username);
    $('#gate').hidden = true; start();
  } catch (e) { msg(e.message); }
  b.disabled = false; b.textContent = label;
};
['gUser', 'gPass', 'gPass2'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') $('#gGo').click(); }));

/* ---------- หมวดที่เพิ่มเอง (เก็บใน Google Sheet ใช้ได้ทุกเครื่อง) ---------- */
const S = { cats: {} };
function catList(scope, base) {
  const own = S.cats[scope] || {};
  const extra = Object.keys(own).filter(c => !base.includes(c)).sort((a, b) => own[b] - own[a]);
  return [...base.filter(c => c !== 'อื่นๆ'), ...extra, 'อื่นๆ'];
}
const isCustom = (scope, c) => !!(S.cats[scope] && c in S.cats[scope]);
function saveCats() { run('saveSettings', 'cats', S.cats).catch(() => toast(t('บันทึกหมวดไม่สำเร็จ'))); }
function bumpCat(scope, base, c) {
  if (!c || base.includes(c)) return;
  const o = S.cats[scope] = S.cats[scope] || {};
  o[c] = (o[c] || 0) + 1; saveCats();
}
function catChip(scope, c, on) {
  return `<button type="button" class="chip${on ? ' on' : ''}" data-c="${esc(c)}" data-v="${esc(c)}"${isCustom(scope, c) ? ` data-custom data-scope="${esc(scope)}"` : ''}>${ico(catIco(c), 17)}${esc(t(c))}</button>`;
}
function catMenu(scope, name) {
  const v = prompt(tf('แก้ชื่อหมวด "{x}"\nลบข้อความทั้งหมดแล้วกด OK = ลบหมวดนี้\n(รายการเก่ายังใช้ชื่อเดิม)', { x: name }), name);
  if (v === null) return;
  const o = S.cats[scope] || {}, n = v.trim();
  if (!n) { if (!confirm(tf('ลบปุ่มหมวด "{x}"?', { x: name }))) return; delete o[name]; }
  else if (n !== name) { o[n] = (o[n] || 0) + (o[name] || 0); delete o[name]; }
  else return;
  saveCats();
  const cp = $('#sheet .catpick');
  if (cp) { const on = $('.on', cp)?.dataset.v; cp.innerHTML = catList(cp.dataset.scope, ECATS).map(c => catChip(cp.dataset.scope, c, c === on)).join(''); }
  toast(t(n ? 'เปลี่ยนชื่อแล้ว' : 'ลบหมวดแล้ว'));
}
// กดค้างที่ปุ่มหมวดที่เพิ่มเอง เพื่อแก้ชื่อหรือลบ
const LP = { t: 0, fired: false, x: 0, y: 0 };
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.chip[data-custom]'); if (!c) return;
  LP.fired = false; LP.x = e.clientX; LP.y = e.clientY; clearTimeout(LP.t);
  LP.t = setTimeout(() => { LP.fired = true; catMenu(c.dataset.scope, c.dataset.v); }, 550);
});

function closeForm() {
  $('#sheetBg').classList.remove('show'); FORM = null; lockScroll(false); renderFab();

const opts = a => a.map(o => Array.isArray(o) ? o : [o, o]);
// ช่องที่แสดงเฉพาะบางกรณี เช่น ยอดบาทจริง เฉพาะตอนจ่ายด้วยบัตรเครดิต
function fieldHTML(f, v) {
  const h = fieldInner(f, v);
  if (!f.when) return h;
  const alts = f.when.any || [typeof f.when[0] === 'string' ? [f.when] : f.when];
  return `<div class="when" data-when="${esc(JSON.stringify(alts))}">${h}</div>`;
}
function formVal(k) {
  const root = $('#sheet'), seg = $(`.seg[data-k="${k}"] .on`, root);
  if (seg) return seg.dataset.v;
  const el = root.querySelector(`[name="${k}"]`); return el ? el.value : '';
}
function applyWhen() {
  $$('#sheet .when').forEach(w => w.hidden = !JSON.parse(w.dataset.when)
    .some(conds => conds.every(([k, v]) => v.split('|').includes(formVal(k)))));
}
function fieldInner(f, v) {
  const val = v ?? f.def ?? '';
  const lab = f.label ? `<label class="fl">${esc(f.label)}</label>` : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  switch (f.type) {
    case 'seg': {
      const o = opts(f.options), cur = val || o[0][0];
      return `<div class="fld">${lab}<div class="seg" data-k="${f.k}">${o.map(([k, l]) =>
        `<button type="button" data-v="${esc(k)}" class="${k === cur ? 'on' : ''}">${esc(t(l))}</button>`).join('')}</div></div>`;
    }
    case 'select':
      return `<div class="fld">${lab}<select name="${f.k}">${opts(f.options).map(([k, l]) =>
        `<option value="${esc(k)}" ${String(k) === String(val) ? 'selected' : ''}>${esc(f.raw ? l : t(l))}</option>`).join('')}</select></div>`;
    case 'checks': {
      const sel = Array.isArray(val) && val.length ? val : f.options;
      return `<div class="fld">${lab}<div class="checks" data-k="${f.k}">${f.options.map(o =>
        `<button type="button" class="chip ${sel.includes(o) ? 'on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
    }
    case 'textarea': return `<div class="fld">${lab}<textarea name="${f.k}"${ph}>${esc(val)}</textarea></div>`;
    case 'photo':
      return `<div class="fld">${lab}<div class="ph" data-k="${f.k}" data-v="${esc(val)}">
        <div class="phimg">${val && T.thumbs[val] ? `<img data-thumb="${esc(val)}">` : ''}</div>
        <label class="phbtn">${ico('camera', 18)}${t(val ? 'เปลี่ยนรูป' : 'เลือกรูป')}<input type="file" accept="image/*" hidden></label>
        ${val ? `<button type="button" class="ghost" data-act="phclear">${t('เอารูปออก')}</button>` : ''}</div></div>`;
    case 'maps':
      return `<div class="fld">${lab}<div class="mrow"><input name="${f.k}" type="url" value="${esc(val)}" placeholder="${esc(t('วางลิงก์จาก Google Maps'))}">
        <button type="button" data-act="fetchName" data-target="${f.target}">${t('ดึงชื่อ')}</button></div></div>`;
    case 'split': return '<div class="fld" id="split"></div>';
    case 'note': return `<div class="tiny" style="margin:-6px 0 14px">${esc(f.text)}</div>`;
    case 'catchips': {
      const list = catList(f.scope, f.base), cur = val || f.base[0];
      if (!list.includes(cur)) list.splice(list.length - 1, 0, cur);
      return `<div class="fld">${lab}<div class="catpick" data-k="${f.k}" data-scope="${esc(f.scope)}">${list.map(c => catChip(f.scope, c, c === cur)).join('')}</div>
        <div class="othbox" ${cur === 'อื่นๆ' ? '' : 'hidden'}><input class="othr" name="__other" placeholder="${esc(t('ค่าอะไร? เช่น ซักผ้า (ไม่ใส่ก็ได้)'))}" autocomplete="off">
        <div class="tiny">${t('ชื่อที่พิมพ์จะกลายเป็นปุ่มหมวดใหม่ (กดค้างที่ปุ่มเพื่อแก้หรือลบ)')}</div></div></div>`;
    }
    case 'money':
      return `<div class="fld">${lab}<input class="amtin num" name="${f.k}" inputmode="decimal" value="${val === '' || val === 0 ? '' : esc(val)}" placeholder="0"><div class="hint num" id="fxHint"></div></div>`;
    case 'number':
      return `<div class="fld">${lab}<input name="${f.k}" inputmode="decimal" value="${val === '' || val === 0 ? '' : esc(val)}"${ph || ' placeholder="0"'}></div>`;
    default:
      return `<div class="fld">${lab}<input name="${f.k}" type="${f.type || 'text'}" value="${esc(val)}"${ph} autocomplete="off"></div>`;
  }
}
function readForm() {
  const o = { ...(FORM.data || {}) }, root = $('#sheet');
  FORM.fields.forEach(f => {
    if (f.type === 'seg') o[f.k] = $(`.seg[data-k="${f.k}"] .on`, root)?.dataset.v || '';
    else if (f.type === 'checks') o[f.k] = $$(`.checks[data-k="${f.k}"] .on`, root).map(b => b.dataset.v);
    else if (f.type === 'photo') o[f.k] = $(`.ph[data-k="${f.k}"]`, root).dataset.v || '';
    else if (f.type === 'split') Object.assign(o, readSplit());
    else if (f.type === 'catchips') {
      const sel = $(`.catpick[data-k="${f.k}"] .on`, root)?.dataset.v || 'อื่นๆ';
      const other = (root.querySelector('[name="__other"]')?.value || '').trim().slice(0, 40);
      o[f.k] = sel === 'อื่นๆ' && other ? other : sel;
    }
    else if (f.type === 'money') o[f.k] = num(root.querySelector(`[name="${f.k}"]`).value);
    else { const el = root.querySelector(`[name="${f.k}"]`); if (el) o[f.k] = f.type === 'number' ? num(el.value) : el.value.trim(); }
  });
  return o;
}

  const amt = num($('#sheet [name="amount"], #sheet [name="cost"]')?.value);
  const e = { amount: amt, method: formVal('method'), tcMode: formVal('tcMode'), thbActual: num(formVal('thbActual')), id: FORM.data && FORM.data.id,
    rate: FORM.data && FORM.data.rate || (T.rateCur === trip().currency ? T.rateToday : 0) };

  const r = rateInfo(e);

    const cs = cardState(e.id);
    extra = tcAuto(e) ? (cs.thbIn ? '\n' + tf('เงินบาทในบัตรเหลือ {x}', { x: baht(cs.thbLeft) }) : '')

function loadImg(file) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(t('เปิดรูปไม่ได้'))); i.setAttribute('s' + 'rc', URL.createObjectURL(file)); });
}
function toJpeg(img, max, q) {
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function handlePhoto(input) {
  const file = input.files[0]; if (!file) return;
  const box = input.closest('.ph'); box.classList.add('busy');
  try {
    const img = await loadImg(file);
    const full = toJpeg(img, 1800, .85);
    let q = .7, th;
    do { th = toJpeg(img, 360, q); q -= .1; } while (th.length > 45000 && q > .2);
    const r = await run('savePhoto', T.id || '', th, full, file.name || 'photo.jpg');
    T.thumbs[r.id] = th;
    box.dataset.v = r.id; $('.phimg', box).innerHTML = `<img data-thumb="${esc(r.id)}">`; fillThumbs(box);
    toast(t('อัปโหลดรูปแล้ว'));
  } catch (e) { toast(t('อัปโหลดรูปไม่สำเร็จ')); }
  box.classList.remove('busy'); input.value = '';
}
async function viewPhoto(id) {
  const v = $('#viewer');
  v.innerHTML = `<img data-thumb="${esc(id)}"><div class="vh">${t('กำลังโหลดรูปเต็ม · แตะเพื่อปิด')}</div>`; fillThumbs(v);
  v.classList.add('show');

  catch (e) { const h = $('.vh', v); if (h) h.textContent = t('โหลดรูปเต็มไม่ได้'); }
}
$('#viewer').onclick = () => $('#viewer').classList.remove('show');

const trip = () => T.recs.find(r => r.kind === 'trip');
// ชื่อของฉันในทริปนี้ และบัญชีที่ผูกกับแต่ละชื่อ
const myName = () => { const x = trip(); return (x.access && x.access[ME.username]) || x.members[0]; };
const userOf = m => { const a = trip().access || {}; return Object.keys(a).find(k => a[k] === m) || ''; };
const isOwner = x => (x || trip()).owner === ME.username;
const shared = x => Object.keys((x || trip()).access || {}).length > 1;
const of = k => T.recs.filter(r => r.kind === k);
const rec = id => T.recs.find(r => r.id === id);
const byTime = (a, b) => (a.time || '99').localeCompare(b.time || '99');
function upsert(r) { const i = T.recs.findIndex(x => x.id === r.id); i >= 0 ? T.recs[i] = r : T.recs.push(r); }
function tripDays(x) {
  const out = []; if (!x || !x.start || !x.end) return out;
  const d = new Date(x.start + 'T00:00'), e = new Date(x.end + 'T00:00');
  while (d <= e && out.length < 90) { out.push(ymd(d)); d.setDate(d.getDate() + 1); }
  return out;
}
const dayOpts = () => tripDays(trip()).map((d, i) => [d, `${tf('วันที่ {n}', { n: i + 1 })} — ${wday(d)} ${fmtD(d)}`]);
const curDay = () => tripDays(trip())[T.day] || trip().start;
const tm = n => money(n, trip().currency);

/* ----- แปลงเป็นเงินบาท -----
   เงินสด = เรทเฉลี่ยที่แลกมา, Travel card แบบแลกไว้ = เรทที่เติม,
   บัตรเครดิต / Travel card แบบตัดเงินบาท / โอน = เรทวันที่บันทึก จนกว่าจะใส่ยอดบาทที่ถูกตัดจริง */
const isFx = () => { const x = trip(); return !!x && !!x.currency && x.currency !== 'THB'; };
const tcur = x => (isFx() && x.cur) || trip().currency;
// เรทเฉลี่ยที่แต่ละคนแลกมา ของเราคำนวณจากรายการในเครื่อง ของเพื่อนใช้ค่าที่เซิร์ฟเวอร์สรุปให้
function walletRate(w, uname) {
  if (!uname || uname === ME.username) {
    const xs = of('topup').filter(x => x.wallet === w && tcur(x) === trip().currency && x.amount > 0 && +x.thb > 0);
    const a = xs.reduce((s, x) => s + x.amount, 0);
    return a ? xs.reduce((s, x) => s + +x.thb, 0) / a : 0;
  }
  const r = T.rates[uname];
  return r ? r[w === 'เงินสด' ? 'cash' : 'card'] || 0 : 0;
}
const payerUser = e => userOf(e.payer) || e.by || trip().owner || ME.username;
function rateInfo(e) {
  const x = trip();
  if (!isFx()) return { rate: 1, src: '' };
  if (+e.thbActual > 0 && e.amount > 0) return { rate: e.thbActual / e.amount, src: 'ยอดที่ถูกตัดจริง' };
  const pu = payerUser(e), mine = pu === ME.username;
  if (e.method === 'เงินสด') { const r = walletRate('เงินสด', pu); if (r) return { rate: r, src: mine ? 'เรทเฉลี่ยที่แลกเงินสดมา' : tf('เรทที่ {x} แลกมา', { x: e.payer }) }; }
  if (e.method === 'Travel card' && !tcAuto(e)) { const r = walletRate('Travel card', pu); if (r) return { rate: r, src: mine ? 'เรทที่แลกเข้า Travel card' : tf('เรทบัตรของ {x}', { x: e.payer }) }; }
  if (e.rate) return { rate: e.rate, src: e.id ? 'เรทวันที่บันทึก' : 'เรทวันนี้' };
  return { rate: +x.rate || 0, src: 'เรทประมาณของทริป' };
}
const thbOf = e => isFx() ? e.amount * rateInfo(e).rate : e.amount;
const estimated = e => isFx() && (e.method === 'บัตรเครดิต' || tcAuto(e)) && !(+e.thbActual > 0);
const fmtRate = r => r >= 1 ? r.toFixed(2) : r >= 0.01 ? r.toFixed(4) : r.toFixed(6);
// ยอดใน Travel card ของฉัน: ส่วนที่แลกเป็นเงินต่างประเทศไว้ และส่วนที่เป็นเงินบาท
function cardState(excludeId) {
  const x = trip(), me = myName(), sum = a => a.reduce((s, e) => s + e.amount, 0);
  const tops = of('topup').filter(y => y.wallet === 'Travel card');
  const fxIn = sum(tops.filter(y => tcur(y) === x.currency));
  const thbIn = isFx() ? sum(tops.filter(y => tcur(y) === 'THB')) : 0;
  const items = expenseItems().filter(e => e.payer === me && e.method === 'Travel card' && e.id !== excludeId);
  const auto = items.filter(tcAuto), pre = items.filter(e => !tcAuto(e));
  const fxUsed = sum(pre), thbUsed = auto.reduce((a, e) => a + thbOf(e), 0);
  return { fxIn, fxUsed, fxLeft: fxIn - fxUsed, thbIn, thbUsed, thbLeft: thbIn - thbUsed, auto, autoFx: sum(auto) };
}
function ensureRate() {
  const cur = trip().currency;
  if (!isFx() || T.rateCur === cur) return;
  run('getRate', cur).then(r => { T.rateToday = r.rate; T.rateCur = cur; updateFxHint(); }).catch(() => {});
}
function cleanPay(o) {
  if (o.method !== 'Travel card') delete o.tcMode;
  if (!(o.method === 'บัตรเครดิต' || o.method === 'โอน/QR' || tcAuto(o))) delete o.thbActual;
}
function stampRate(o) { if (isFx() && !o.rate) o.rate = T.rateCur === trip().currency && T.rateToday || +trip().rate || 0; }
function tripStatus(x) {
  const today = ymd(new Date());
  if (x.start > today) return ['soon', tf('อีก {n} วัน', { n: Math.round((new Date(x.start) - new Date(today)) / 864e5) })];
  return x.end >= today ? ['now', t('กำลังเที่ยว')] : ['', t('จบแล้ว')];
}

/* ----- โหลดข้อมูล ----- */
async function loadTrips() {
  if (!T.list) $('#trips').innerHTML = `<div class="empty">${t('กำลังโหลด…')}</div>`;
  try { T.list = await run('listTrips'); if (!T.id) renderTrips(); }
  catch (e) {
    if (T.id) return;
    $('#trips').innerHTML = `<div class="block"><div class="empty">${t('โหลดทริปไม่สำเร็จ')}<br>${esc(e && e.message || e)}</div>
      <button class="btn" data-act="retry">${t('ลองใหม่')}</button></div>`;
  }
}
function applyTrip(r) { T.recs = r.recs; T.thumbs = r.thumbs || {}; T.rates = r.rates || {}; T.loadedAt = Date.now(); }
// โหลดทริปใหม่เงียบๆ เพื่อเห็นรายการที่เพื่อนเพิ่งบันทึก
async function reloadTrip() {
  if (!T.id || $('#sheetBg').classList.contains('show')) return;
  const id = T.id;
  try { const r = await run('getTrip', id); if (T.id === id && !$('#sheetBg').classList.contains('show')) { applyTrip(r); renderTrips(); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && T.id && Date.now() - (T.loadedAt || 0) > 20000) reloadTrip(); });
function goTrip(id) { openTrip(id); }
async function openTrip(id) {
  T.id = id; T.recs = []; T.sub = 'overview'; T.day = 0; T.who = ''; T.catAll = false;
  $('#trips').innerHTML = `<div class="empty">${t('กำลังเปิดทริป…')}</div>`; renderFab();
  try {
    applyTrip(await run('getTrip', id));
    const i = tripDays(trip()).indexOf(ymd(new Date()));
    if (i >= 0) { T.day = i; T.sub = 'plan'; }
    renderTrips(); window.scrollTo(0, 0);
  } catch (e) { toast(e.message); T.id = null; loadTrips(); }
}
function saver(kind) {
  return async o => { o.kind = kind; o.tripId = T.id; upsert(await run('saveRec', o)); renderTrips(); toast(t('บันทึกแล้ว')); };
}
function deleter(id) {
  return async () => { if (!confirm(t('ลบรายการนี้?'))) return false; await run('deleteRec', id); T.recs = T.recs.filter(r => r.id !== id); renderTrips(); toast(t('ลบแล้ว')); };
}

$('#fab').onclick = () => T.sub === 'wallet' ? topupForm() : expForm();

  el.innerHTML = `<div class="thead"><button class="ib" data-act="back" aria-label="${t('กลับ')}">${ico('left')}</button>
      <div class="mid"><h1>${esc(x.name)}</h1>
      <div class="m">${ico('cal', 15)}${fmtD(x.start)} – ${fmtD(x.end)}, ${tf('{n} วัน', { n: tripDays(x).length })}</div>
      <div class="m">${ico('users', 15)}<span>${x.members.map(m => esc(m) + (m === myName() && x.members.length > 1 ? ' ' + t('(คุณ)') : '')).join(', ')}</span></div></div>
      <button class="ib" data-act="share" aria-label="${t('แชร์ทริป')}">${ico('users', 18)}</button>
      ${isOwner(x) ? `<button class="ib" data-act="editTrip" aria-label="${t('แก้ไขทริป')}">${ico('edit', 18)}</button>` : ''}</div>
    <nav class="tabs">${subs.map(([k, l, i]) => `<button data-act="sub" data-s="${k}" class="${T.sub === k ? 'on' : ''}">${ico(i, 19)}${t(l)}</button>`).join('')}</nav>

/* ----- ภาพรวม ----- */
const nights = s => s.checkin && s.checkout ? Math.max(0, Math.round((new Date(s.checkout) - new Date(s.checkin)) / 864e5)) : 0;
function viewOverview(x) {
  const fl = of('flight').sort((a, b) => ((a.date || '') + (a.dep || '')).localeCompare((b.date || '') + (b.dep || '')));
  const st = of('stay').sort((a, b) => (a.checkin || '').localeCompare(b.checkin || ''));
  const pre = fl.reduce((a, f) => a + (+f.price || 0), 0) + st.reduce((a, s) => a + (+s.price || 0), 0);
  const okF = s => s === 'ซื้อตั๋วแล้ว' || s === 'เช็คอินแล้ว';
  const add = act => `<button class="link" data-act="${act}">${ico('plus', 16)}${t('เพิ่ม')}</button>`;
  return `
  <div class="block">${head('plane', t('เที่ยวบิน'), t('ตั๋ว เวลา และบอร์ดดิ้งพาส'), add('addFlight'))}
  ${fl.length ? fl.map(f => `<div class="ticket tap" data-act="editFlight" data-id="${esc(f.id)}">
      <div class="tk-top"><span>${esc(t(f.dir))}, ${wday(f.date)} ${fmtD(f.date)}</span><span class="pill ${okF(f.status) ? 'ok' : 'no'}">${esc(t(f.status))}</span></div>
      <div class="tk-route"><div><b>${esc(f.from || '—')}</b><small>${esc(f.dep || '')}</small></div>
        <div class="tk-line">${ico('air', 18)}</div>
        <div class="r"><b>${esc(f.to || '—')}</b><small>${esc(f.arr || '')}</small></div></div>
      <div class="meta">${[f.flightNo, f.airline, f.ref && tf('รหัสจอง {x}', { x: f.ref }), f.seat && tf('ที่นั่ง {x}', { x: f.seat })].filter(Boolean).map(y => `<span>${esc(y)}</span>`).join('')}</div>
      ${f.note ? `<div class="nt">${esc(f.note)}</div>` : ''}
      ${f.pass || f.flightNo ? `<div class="acts">${thumb(f.pass)}
        ${f.flightNo ? extLink('https://www.google.com/search?q=' + enc(f.flightNo + ' flight status'), 'ext', t('สถานะเที่ยวบิน')) : ''}</div>` : ''}
    </div>`).join('') : `<div class="empty">${t('ยังไม่มีเที่ยวบิน')}<br>${t('ถ้าเดินทางด้วยรถ ข้ามส่วนนี้ได้')}</div>`}
  </div>
  <div class="block">${head('bed', t('ที่พัก'), t('เช็คอิน เช็คเอาท์ และลิงก์แผนที่'), add('addStay'))}
  ${st.length ? st.map(s => `<div class="ticket tap" data-act="editStay" data-id="${esc(s.id)}">
      <div class="tk-top"><span>${fmtD(s.checkin)} – ${fmtD(s.checkout)}, ${tf('{n} คืน', { n: nights(s) })}</span><span class="pill ${s.status === 'จองแล้ว' ? 'ok' : 'no'}">${esc(t(s.status))}</span></div>
      <div class="tt serif" style="margin-top:4px;font-size:18px">${esc(s.name || t('ที่พัก'))}</div>
      ${s.price ? `<div class="meta"><span>${baht(s.price)}</span></div>` : ''}
      ${s.note ? `<div class="nt">${esc(s.note)}</div>` : ''}
      ${s.photo || s.maps || s.name ? `<div class="acts">${thumb(s.photo)}${extLink(s.maps ? safeUrl(s.maps) : mapSearchLink(s.name), 'pin', t('แผนที่'))}</div>` : ''}
    </div>`).join('') : `<div class="empty">${t('ยังไม่มีที่พัก')}</div>`}
  </div>
  <div class="block">${head('receipt', t('สรุปทริป'), t('ยอดจองล่วงหน้ากับค่าใช้จ่ายระหว่างทริป'))}<div class="kv">
    <span>${t('ตั๋วและที่พักที่จองไว้')}</span><b class="num">${baht(pre)}</b>
    <span>${t('ค่าใช้จ่ายระหว่างทริป')}</span><b class="num">${tm(expenseItems().reduce((a, e) => a + e.amount, 0))}</b>
    ${isFx() ? `<span>${t('คิดเป็นเงินบาท')}</span><b class="num">≈ ${baht(expenseItems().reduce((a, e) => a + thbOf(e), 0))}</b>` : ''}</div>
    ${isFx() ? `<div class="tiny" style="margin-top:12px">${t('สกุลเงิน')}: ${tf('{c}, เรทประมาณ 1 = {r} บาท', { c: esc(x.currency), r: fmtRate(+x.rate || 0) })}</div>` : ''}</div>`;
}

/* ----- แผนรายวัน ----- */
function stopName(s) { return s.myName || s.name || t('สถานที่'); }
function viewPlan(x) {
  const days = tripDays(x);
  if (!days.length) return `<div class="block empty">${t('ตั้งวันเริ่มและวันจบทริปก่อน')}</div>`;
  T.day = Math.min(T.day, days.length - 1);
  const d = days[T.day], dc = dayColor(d);
  const items = [...of('stop'), ...of('leg')].filter(r => r.date === d).sort(byTime);
  const fls = of('flight').filter(f => f.date === d);
  const stay = of('stay').find(s => s.checkin <= d && d < s.checkout);
  let prev = null;
  const tl = items.map(r => {
    if (r.kind === 'leg') return `<div class="tli leg tap" data-act="editLeg" data-id="${esc(r.id)}">
      <div class="tm">${esc(r.time || '')}</div><div class="dot"></div>
      <div><div class="tt">${ico(MODEI[r.mode] || 'route', 15)}${esc(modeLabel(r.mode))}</div>
        <div>${esc(r.from || '?')} → ${esc(r.to || '?')}</div>
        ${r.line ? `<div class="sub">${esc(r.line)}</div>` : ''}${r.note ? `<div class="nt">${esc(r.note)}</div>` : ''}
        ${r.cost > 0 ? `<div class="cost">${tm(r.cost)}, ${esc(t(r.method))}, ${tf('{x} จ่าย', { x: esc(r.payer) })}</div>` : ''}</div></div>`;
    const q = r.name || r.myName;
    const dir = prev ? mapDirLink(prev.name || prev.myName, q) : '';
    prev = r;
    return `<div class="tli tap" data-act="editStop" data-id="${esc(r.id)}">
      <div class="tm">${esc(r.time || '')}</div><div class="dot"></div>
      <div><div class="tt">${esc(stopName(r))}</div>
        ${r.myName && r.name && r.myName !== r.name ? `<div class="sub">${esc(r.name)}</div>` : ''}
        ${r.note ? `<div class="nt">${esc(r.note)}</div>` : ''}
        <div class="acts">${thumb(r.photo)}
          ${extLink(r.maps ? safeUrl(r.maps) : mapSearchLink(q), 'pin', t('แผนที่'))}
          ${dir ? extLink(dir, 'route', t('เส้นทาง')) : ''}</div></div></div>`;
  }).join('');
  return `<div class="days">${days.map((y, i) => `<button class="${i === T.day ? 'on' : ''}" style="--dc:${dayColor(y)}" data-act="day" data-i="${i}"><b>${tf('วันที่ {n}', { n: i + 1 })}</b><span>${wday(y)} ${fmtD(y)}</span></button>`).join('')}</div>
    <div class="dayhead" style="--dc:${dc}"><i></i><h2>${wday(d, true)}</h2><span>${fmtD(d)}</span></div>
    ${fls.map(f => `<div class="banner">${ico('plane', 16)}${esc(t(f.dir))} ${esc(f.flightNo || '')} ${esc(f.dep || '')}  ${esc(f.from || '')} → ${esc(f.to || '')}</div>`).join('')}
    <div class="block" style="--dc:${dc}"><div class="tl">${tl || `<div class="empty">${t('ยังไม่มีแผนวันนี้')}<br>${t('เริ่มจากเพิ่มสถานที่แรก')}</div>`}</div>
      <div class="pair"><button class="ghost" data-act="addStop">${ico('pin', 16)}${t('สถานที่')}</button><button class="ghost" data-act="addLeg">${ico('route', 16)}${t('การเดินทาง')}</button></div></div>
    ${stay ? `<div class="banner">${ico('bed', 16)}${tf('คืนนี้พักที่ {x}', { x: esc(stay.name) })}</div>` : ''}`;
}

/* ----- ค่าใช้จ่าย & หารเงิน ----- */
function expenseItems() {
  const x = trip();
  const legs = of('leg').filter(l => l.cost > 0).map(l => ({ id: l.id, origin: 'leg', title: `${modeLabel(l.mode)} ${l.from || ''} → ${l.to || ''}`,
    date: l.date, amount: l.cost, payer: l.payer || x.members[0], method: l.method || 'เงินสด', mode: 'equal', by: l.by,
    members: l.members && l.members.length ? l.members : x.members, category: 'เดินทาง', rate: l.rate, thbActual: l.thbActual, tcMode: l.tcMode }));
  return [...of('exp').map(e => Object.assign({}, e, { origin: 'exp' })), ...legs];
}
function shares(e) {
  if (e.mode === 'custom') return e.parts || {};
  if (e.mode === 'self') return { [e.payer]: e.amount };
  const m = e.members && e.members.length ? e.members : trip().members, o = {};
  m.forEach(n => o[n] = e.amount / m.length);
  return o;
}
function settleThb(s) {
  const x = trip(), cur = s.cur || x.currency;
  if (cur === 'THB') return s.amount;

function balances() { // ทุกยอดเป็นเงินบาท

  trip().members.forEach(m => { bal[m] = 0; paid[m] = 0; used[m] = 0; });
  expenseItems().forEach(e => {
    const thb = thbOf(e), k = e.amount ? thb / e.amount : 0;

  });

  return { bal, paid, used };
}
// สรุปตามหมวด ทั้งทริป หรือเฉพาะส่วนของคนหนึ่ง: [หมวด, ยอดสกุลทริป, ยอดบาท]
function catStats(person) {
  const m = {};
  expenseItems().forEach(e => {
    const f = !person ? 1 : e.amount ? (shares(e)[person] || 0) / e.amount : 0;
    if (!f) return;
    const y = m[e.category || 'อื่นๆ'] = m[e.category || 'อื่นๆ'] || [0, 0];
    y[0] += e.amount * f; y[1] += thbOf(e) * f;

function suggestPay(bal) {
  const cr = [], db = [];
  for (const n in bal) { const v = Math.round(bal[n] * 100) / 100; if (v > 0.009) cr.push([n, v]); else if (v < -0.009) db.push([n, -v]); }
  cr.sort((a, b) => b[1] - a[1]); db.sort((a, b) => b[1] - a[1]);
  const out = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length) {
    const y = Math.min(db[i][1], cr[j][1]);
    out.push({ from: db[i][0], to: cr[j][0], amount: Math.round(y * 100) / 100 });
    db[i][1] -= y; cr[j][1] -= y;
    if (db[i][1] < 0.01) i++; if (cr[j][1] < 0.01) j++;
  }
  return out;
}

function drawSplitBody(mode, d) {
  const x = trip();
  if (mode === 'self') {
    $('#splitBody').innerHTML = '<div class="hint" id="splitHint"></div>';
  } else if (mode === 'equal') {
    const sel = d.members && d.members.length ? d.members : x.members;
    $('#splitBody').innerHTML = `<div class="checks" id="splitMembers">${x.members.map(m =>
      `<button type="button" class="chip ${sel.includes(m) ? 'on' : ''}" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div><div class="hint" id="splitHint"></div>`;
  } else {
    const p = d.parts || {};
    $('#splitBody').innerHTML = x.members.map(m => `<div class="prow"><span>${esc(m)}</span>
      <input inputmode="decimal" data-p="${esc(m)}" value="${p[m] ?? ''}" placeholder="0"></div>`).join('') + '<div class="hint" id="splitHint"></div>';
  }
  updateSplitHint();
}
function readSplit() {
  const mode = $('#splitMode .on')?.dataset.m || 'equal';
  if (mode === 'self') { const p = formVal('payer'); return { mode, members: p ? [p] : [], parts: null }; }
  if (mode === 'equal') return { mode, members: $$('#splitMembers .on').map(b => b.dataset.v), parts: null };
  const parts = {};
  $$('#splitBody [data-p]').forEach(i => { const v = num(i.value); if (v > 0) parts[i.dataset.p] = v; });
  return { mode, parts, members: Object.keys(parts) };
}
function updateSplitHint() {
  const h = $('#splitHint'); if (!h) return;
  const amt = num($('[name="amount"]')?.value), s = readSplit();
  if (s.mode === 'self') h.textContent = tf('ค่าใช้จ่ายของ {x} คนเดียว ไม่หารใคร', { x: formVal('payer') }) + (shared() ? t(' และเพื่อนในทริปจะไม่เห็นรายการนี้') : '');
  else if (s.mode === 'equal') h.textContent = s.members.length ? tf('คนละ {x}', { x: tm(amt / s.members.length) }) : t('เลือกอย่างน้อย 1 คน');
  else {
    const diff = amt - Object.values(s.parts).reduce((a, b) => a + b, 0);
    h.textContent = Math.abs(diff) < 0.01 ? t('ยอดครบแล้ว') : diff > 0 ? tf('ยังเหลือ {x} ที่ยังไม่ได้แบ่ง', { x: tm(diff) }) : tf('เกินยอดรวม {x}', { x: tm(-diff) });
  }
}

    if (r.joined) { closeForm(); toast(t('คุณอยู่ในทริปนี้แล้ว')); goTrip(r.id); return; }
    JOIN.code = code;
    const free = r.members.filter(m => !r.taken.includes(m));
    $('#joinBody').innerHTML = `<div class="jtrip"><div class="tt">${esc(r.name)}</div><div class="sub">${fmtD(r.start)} – ${fmtD(r.end)}</div></div>
      <label class="fl">${t('คุณคือใครในทริปนี้')}</label>
      ${free.length ? `<div class="jchecks" id="joinNames">${free.map(m => `<button type="button" class="chip" data-act="joinPick" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>` : ''}
      <input class="othr" id="joinNew" placeholder="${esc(t(free.length ? 'หรือพิมพ์ชื่อใหม่ ถ้าไม่มีชื่อคุณ' : 'พิมพ์ชื่อที่เพื่อนเรียกคุณ'))}" autocomplete="off">
      ${r.taken.length ? `<div class="tiny">${tf('ชื่อที่มีคนเลือกแล้ว: {x}', { x: esc(r.taken.join(', ')) })}</div>` : ''}
      <div style="height:16px"></div>`;
    $('#joinCode').disabled = true;
    b.dataset.act = 'joinGo'; b.textContent = t('เข้าร่วมทริป');
  } catch (y) { toast(y.message); b.textContent = t('ถัดไป'); }
  b.disabled = false;
}
async function joinGo() {
  const member = ($('#joinNew')?.value || '').trim() || $('#joinNames .chip.on')?.dataset.v || '';
  if (!member) return toast(t('เลือกชื่อของคุณ หรือพิมพ์ชื่อใหม่'));
  const b = $('#joinBtn'); b.disabled = true; b.textContent = t('กำลังเข้าร่วม…');
  try { const r = await run('joinTrip', JOIN.code, member); closeForm(); toast(t('เข้าร่วมทริปแล้ว')); goTrip(r.id); }
  catch (y) { toast(y.message); b.disabled = false; b.textContent = t('เข้าร่วมทริป'); }
}

/* ----- ปุ่มในหน้าทริป ----- */
$('#trips').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  const acts = {
    retry: () => loadTrips(), account: () => openAccount(),
    newTrip: () => tripForm(), openTrip: () => openTrip(id),
    back: () => { T.id = null; T.recs = []; renderTrips(); loadTrips(); },
    editTrip: () => tripForm(trip()),
    sub: () => { T.sub = b.dataset.s; renderTrips(); window.scrollTo(0, 0); if (Date.now() - (T.loadedAt || 0) > 60000) reloadTrip(); },
    join: () => openJoin(''), share: () => openShare(),
    day: () => { T.day = +b.dataset.i; renderTrips(); },
    addFlight: () => flightForm(), editFlight: () => flightForm(rec(id)),
    addStay: () => stayForm(), editStay: () => stayForm(rec(id)),
    addStop: () => stopForm(), editStop: () => stopForm(rec(id)),
    addLeg: () => legForm(), editLeg: () => legForm(rec(id)),
    addExp: () => expForm(), editExp: () => expForm(rec(id)),
    doSettle: () => settleForm({ from: b.dataset.from, to: b.dataset.to, amount: +b.dataset.amt, cur: 'THB' }),
    who: () => { T.who = b.dataset.v; T.catAll = false; renderTrips(); },
    catAll: () => { T.catAll = !T.catAll; renderTrips(); },
    editSettle: () => settleForm(rec(id)),
    addTopup: () => topupForm(), editTopup: () => topupForm(rec(id)),
    view: () => viewPhoto(id)
  };
  acts[b.dataset.act] && acts[b.dataset.act]();
});

/* ---------- เริ่ม ---------- */
function resetState() { T.id = null; T.recs = []; T.list = null; T.rates = {}; S.cats = {}; $('#trips').innerHTML = ''; renderFab(); }
async function start() {
  try { ME.username = (await run('me')).username; LS.set('ts_user', ME.username); }
  catch (e) { if (e.code === 'AUTH') return; }
  run('getSettings').then(o => { S.cats = o.cats || {}; }).catch(() => {});
  if (QJOIN) { const c = QJOIN; QJOIN = ''; openJoin(c); }
  if (!T.id) loadTrips();
}
// เอาโค้ดเชิญออกจากลิงก์ ไม่ให้ติดไปกับไอคอนบนหน้าจอโฮม
if (QJOIN) try { history.replaceState(null, '', location.pathname + (QAPI ? '?api=' + enc(QAPI) : '')); } catch (e) {}
setLang(LANG);
if (API.url && API.tok) start(); else showGate('');
</script>
